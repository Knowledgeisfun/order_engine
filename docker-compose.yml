version: '3.8'

services:
  db:
    image: postgres:16
    container_name: order-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: order-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: